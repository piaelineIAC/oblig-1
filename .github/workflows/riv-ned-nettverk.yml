name: Riv ned nettverk – dev og test

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Skriv nøyaktig: SLETT dev og test"
        required: true
        type: string

permissions:
  contents: read

jobs:
  bekreft:
    name: Kontroller bekreftelse
    runs-on: ubuntu-latest

    steps:
      - name: Valider bekreftelsesteksten
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "SLETT dev og test" ]; then
            echo "Bekreftelsen må være: SLETT dev og test"
            exit 1
          fi
          echo "Bekreftelsen er riktig."
  destroy:
    name: Riv ned ${{ matrix.environment }}
    needs: bekreft
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}

    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        environment:
          - dev
          - test

    concurrency:
      group: terraform-nettverk-${{ matrix.environment }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: stacks/nettverk

    env:
      TF_INPUT: "false"
      TF_IN_AUTOMATION: "true"

      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      TARGET_ENV: ${{ matrix.environment }}
      TF_STATE_KEY: "${{ matrix.environment }}/nettverk.tfstate"
      TFVARS_SECRET: "nettverk-${{ matrix.environment }}-tfvars"

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Logg inn i Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Init
        run: |
          terraform init \
            -backend-config=../../shared/backend.hcl \
            -backend-config="key=$TF_STATE_KEY"
      - name: Validate
        run: terraform validate

      - name: Hent parameterfil fra Key Vault
        run: |
          umask 077
          az keyvault secret download \
            --vault-name kv-piaeb \
            --name "$TFVARS_SECRET" \
            --file "$RUNNER_TEMP/nettverk.tfvars" \
            --encoding utf-8 \
            --output none
      - name: Lag plan for nedriving
        run: |
          terraform plan -destroy \
            -var-file="$RUNNER_TEMP/nettverk.tfvars" \
            -var="environment=$TARGET_ENV" \
            -out="$RUNNER_TEMP/destroy.tfplan"
      - name: Utfør nedriving
        run: terraform apply "$RUNNER_TEMP/destroy.tfplan"

      - name: Slett parameterfil og planfil
        if: always()
        working-directory: ${{ runner.temp }}
        run: |
          rm -f "$RUNNER_TEMP/nettverk.tfvars"
          rm -f "$RUNNER_TEMP/destroy.tfplan"
